<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Color Mixer</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<footer>
  <p id="app-status"></p>
</footer>
<div id="auth-section">
  <div id="login-form">
    <h3>Login</h3>
    <input type="text" id="login-id" placeholder="User ID" value="12345">
    <input type="email" id="login-email" placeholder="Email" value="student@example.com">
    <select id="login-segment">
      <option value="premium_user">Premium User</option>
      <option value="free_user">Free User</option>
    </select>
    <button id="login-btn">Login</button>
  </div>
  <div id="user-info" style="display:none">
    <span id="user-label"></span>
    <button id="logout-btn">Logout</button>
  </div>
</div>

<h2>Simple Color Mixer</h2>

<label>Red:</label>
<input type="range" id="red" min="0" max="255"><br>

<label>Green:</label>
<input type="range" id="green" min="0" max="255"><br>

<label>Blue:</label>
<input type="range" id="blue" min="0" max="255"><br><br>

<div id="colorBox"></div>
<p>HEX Color: <span id="hexColor">#000000</span></p>

<br>
<button id="applyColor">Read Sensors</button>
<button id="resetColor">Reset</button>
<button id="urgent-btn" style="display:none">Only Bright Colors</button>
<button id="break-btn">Break the world</button>

<div id="sensorBox"></div>
<p>Sensor HEX Color: <span id="sensorHex">#000000</span></p>


<script type="module" src="./main.js"></script>
<script type="module">
  import { init } from './js/script.js';
  init();
</script>

</body>
</html>
